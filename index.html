<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de Puntos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap">
<style>
:root{color-scheme:dark;--lime:#c3ff80;--navy:#243a72;--coral:#ff6b6b;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(120% 55% at 50% -8%,#2d4fa3 0%,transparent 62%),linear-gradient(180deg,#12275c,#0a1a45 50%,#061238) fixed}
main{max-width:520px;margin:0 auto;padding:44px 20px 270px}
.clk{position:fixed;top:0;left:0;right:0;z-index:8;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 18px;padding-top:calc(9px + env(safe-area-inset-top,0px));background:rgba(6,18,56,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px;letter-spacing:.05em;border-bottom:1px solid var(--line)}
.clk .ct{font-weight:800;color:var(--clockText,var(--lime))}
.clk .cn{opacity:.75;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button:disabled{opacity:.5;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:transform .15s}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.hd{position:sticky;top:44px;z-index:5;display:flex;justify-content:space-between;align-items:baseline;margin:0 -20px 18px;padding:18px 24px;background:rgba(48,72,125,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);letter-spacing:.16em;font-size:13px;font-weight:600}
.hd b{font-size:44px;letter-spacing:0;font-weight:800;color:var(--lime);line-height:1}
.row{display:flex;align-items:center;gap:16px;width:100%;padding:16px 18px;margin-bottom:12px;border-radius:24px;background:var(--card);border:1px solid var(--line);text-align:left}
.row .l{flex:1;min-width:0}
.nm{font-weight:300;font-size:clamp(20px,6vw,26px);letter-spacing:.16em;text-transform:uppercase;margin-bottom:12px}
.bar{height:14px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;position:relative;overflow:hidden;border-radius:99px;background:linear-gradient(90deg,#a8ef5c,#e4ffb0);box-shadow:0 0 16px rgba(195,255,128,.5);transition:width .8s cubic-bezier(.22,1,.36,1)}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.2s infinite}
.tot{flex:none;width:84px;height:84px;border-radius:22px;display:grid;place-items:center;text-align:center;font-size:11px;letter-spacing:.14em;background:rgba(255,255,255,.08);border:1px solid var(--line);transition:background .4s,color .4s}
.tot b{display:block;font-size:32px;letter-spacing:0;font-weight:800;line-height:1.1}
.tot.pos{background:linear-gradient(150deg,#d4ff9a,#a8ef5c);color:#0a1a45;border-color:transparent;box-shadow:0 8px 22px rgba(168,239,92,.28)}
.tot.neg{background:linear-gradient(150deg,#ff9a9a,#ff6b6b);color:#3a0f0f;border-color:transparent}
.link{display:block;margin:16px auto 0;padding:8px 14px;text-decoration:underline;font-size:13px;opacity:.65}
.rw{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,#061238 30px)}
.rw>div{max-width:492px;margin:0 auto;padding:16px 14px 16px;border:1px solid rgba(195,255,128,.5);border-radius:28px;background:rgba(6,18,56,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-align:center;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.rw h3{margin:0 0 12px;color:var(--lime);font-size:clamp(24px,7vw,32px);letter-spacing:.04em;font-weight:800}
.tiles{display:flex;gap:10px;align-items:stretch}
.tile{flex:1;border-radius:20px;background:rgba(195,255,128,.22);color:#dfe8c9;padding:14px 4px;font-size:12px;font-style:italic;display:grid;place-content:center;gap:2px;border:1px solid rgba(195,255,128,.18)}
.tile b{font-size:clamp(26px,8vw,38px);font-style:normal;font-weight:800}
.tile.on{flex:1.35;color:#0a1a45;background:linear-gradient(150deg,#d4ff9a,#a8ef5c);animation:glow 2s ease-in-out infinite}
.tile.on span{background:var(--navy);color:#fff;font-style:normal;font-weight:800;font-size:11px;letter-spacing:.06em;border-radius:9px;padding:8px 6px;margin-bottom:4px}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px}
.top h1{margin:0;font-weight:300;font-size:clamp(32px,10vw,44px);letter-spacing:.1em}
.cb{width:50px;height:50px;border:1.5px solid rgba(255,255,255,.22);border-radius:50%;display:grid;place-items:center;background:var(--card)}
.cb svg{width:24px;height:24px;stroke:var(--navIcon,#dfe6f7);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 16px}
.pill{display:flex;justify-content:space-between;align-items:baseline;padding:12px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:13px;font-style:italic}
.pill b{font-size:32px;font-style:normal;font-weight:800;line-height:1.1}
.pill.g{background:linear-gradient(150deg,#d4ff9a,#a8ef5c);color:#0a1a45;border-color:transparent}
.it{display:grid;grid-template-columns:34px 76px 1fr auto 50px;gap:8px;align-items:center;padding:12px 12px;margin-bottom:10px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:background .4s,border-color .4s}
.pen{padding:5px;display:grid}.pen svg{width:22px;height:22px;stroke:#b9c4e0;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tm{font-weight:800;font-size:14px;line-height:1.15}
.tt{text-align:center;min-width:0}
.tt h2{margin:0;font-weight:300;font-size:clamp(16px,4.8vw,20px);letter-spacing:.1em;overflow-wrap:anywhere}
.tt p{margin:3px 0 0;font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pt{font-size:12px;font-style:italic;color:var(--lime);text-align:right}.neg .pt{color:var(--coral)}.neu .pt{color:#b9c4e0}
.ck{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.1);display:grid;place-items:center;transition:background .3s,transform .12s}
.ck svg{width:26px;height:26px;stroke:rgba(255,255,255,.35);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.done{border-color:rgba(195,255,128,.35);background:rgba(195,255,128,.07)}
.done.neg{border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.08)}
.done.neu{border-color:rgba(219,230,255,.35);background:rgba(219,230,255,.07)}
.done .ck{background:var(--lime)}.done.neg .ck{background:var(--coral)}.done.neu .ck{background:#dbe6ff}
.done .ck svg{stroke:var(--navy)}
.pop{--rc:195,255,128;animation:pop .5s cubic-bezier(.34,1.56,.64,1),ring .65s ease-out}
.neg .pop{--rc:255,107,107}
.pop svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .35s .12s ease-out forwards}
.in{animation:up .5s backwards;animation-delay:calc(var(--i,0)*55ms)}
.flash{animation:flash .9s ease-out}
.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:rgba(12,26,72,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s}
.sheet{position:relative;width:100%;max-width:420px;max-height:92vh;overflow:auto;border-radius:34px;background:linear-gradient(160deg,#d8ffa4,#b4f468);color:#000;padding:30px 24px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:sheet .45s cubic-bezier(.34,1.3,.64,1)}
.xclose{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.12);font-size:15px;display:grid;place-items:center;z-index:1}
.ov.out{animation:fadeout .22s forwards}.ov.out .sheet{animation:sheetout .22s forwards}
.sheet h2{margin:0;text-align:center;font-size:clamp(28px,8vw,36px);font-weight:800;color:var(--navy)}
.big{text-align:center;font-size:clamp(76px,26vw,116px);font-weight:800;color:var(--navy);line-height:1.05;margin:6px 0 20px;animation:bump .6s cubic-bezier(.34,1.56,.64,1)}
.sheet h4{text-align:center;font-size:21px;margin:0 0 12px;font-weight:800}
.op{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:9px 6px;font-size:17px;letter-spacing:.08em;animation:up .4s backwards;animation-delay:calc(var(--i)*70ms + .3s)}
.op i{flex:none;width:28px;height:28px;border:3px solid #000;border-radius:9px;transition:background .2s}
.op:active i{background:rgba(36,58,114,.35)}
.op.x{text-decoration:line-through}.op.x i{background:var(--navy)}
.op:disabled{opacity:.55;cursor:default}
label{display:block;text-align:center;font-size:20px;letter-spacing:.14em;text-transform:uppercase;margin:16px 0 8px;font-weight:300}
label:first-child{margin-top:0}
input{width:100%;border:0;border-radius:14px;background:#fff;padding:15px 18px;font:italic 16px inherit;color:#444}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.seg2{grid-template-columns:repeat(2,1fr)}
.seg button{background:#fff;border-radius:14px;padding:12px 4px;font-size:12.5px;font-weight:600;transition:background .25s,color .25s,transform .15s}
.seg button.on{background:var(--navy);color:#fff}
.inwrap{position:relative}
.inwrap input{padding-right:40px}
.clr{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#9aa5c2;font-size:14px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.clr:active{background:rgba(0,0,0,.08)}
.any{display:block;margin:0 auto 10px;padding:9px 16px;border-radius:99px;background:#fff;font-size:13px;font-weight:600;transition:background .25s,color .25s}
.any.on{background:var(--navy);color:#fff}
.wheels{position:relative;display:flex;gap:4px;height:176px;background:#fff;border-radius:18px;overflow:hidden;transition:opacity .25s}
.wheels.off{opacity:.45}
.wheels::before{content:"";position:absolute;left:8px;right:8px;top:66px;height:44px;border-radius:12px;background:rgba(36,58,114,.12);pointer-events:none}
.wheels::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#fff 0,rgba(255,255,255,0) 36%,rgba(255,255,255,0) 64%,#fff 100%)}
.wc{flex:1;height:176px;overflow-y:scroll;scroll-snap-type:y mandatory;padding:66px 0;scrollbar-width:none}
.wc::-webkit-scrollbar{display:none}
.wc div{height:44px;line-height:44px;text-align:center;font-size:22px;font-weight:600;color:#9aa5c2;scroll-snap-align:center;transition:color .15s,transform .15s;cursor:pointer}
.wc div.s{color:var(--navy);transform:scale(1.18)}
.sy{text-align:center;font-size:12px;opacity:.6;margin-top:10px}
.b{display:block;width:100%;border-radius:99px;padding:19px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:14px;margin-top:12px}
.b.p{background:#465b8a;color:#fff;margin-top:24px;box-shadow:0 8px 20px rgba(36,58,114,.35)}.b.w{background:#fff;color:#000}
.toast{position:fixed;left:50%;bottom:250px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:99px;font-size:14px;z-index:20;animation:toast 2.2s forwards}
.fl{position:fixed;font-weight:800;font-size:22px;color:var(--lime);pointer-events:none;z-index:15;text-shadow:0 2px 10px rgba(0,0,0,.45);animation:floatup .9s ease-out forwards}
.fl.n{color:var(--coral)}
.cf{position:absolute;left:50%;top:38%;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:burst 1.2s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(var(--rc),.75)}100%{box-shadow:0 0 0 18px rgba(var(--rc),0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes fade{from{opacity:0}}@keyframes fadeout{to{opacity:0}}
@keyframes sheet{from{opacity:0;transform:translateY(40px) scale(.92)}}
@keyframes sheetout{to{opacity:0;transform:translateY(30px) scale(.95)}}
@keyframes bump{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(195,255,128,.5)}50%{box-shadow:0 0 22px 4px rgba(195,255,128,.55)}}
@keyframes flash{0%{background:rgba(195,255,128,.35)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,14px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-58px)}}
@keyframes burst{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),calc(var(--y) + 150px)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.pop svg path{stroke-dasharray:none;stroke-dashoffset:0}}
.phrase{grid-column:1/-1;text-align:center;margin:4px auto 28px;padding:14px 24px 4px;max-width:820px}.phrase .eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--lime);font-weight:800;opacity:.9;margin-bottom:10px}.phrase .quote{font-size:clamp(18px,2.4vw,28px);line-height:1.35;font-weight:300;letter-spacing:.015em}.phrase .quote::before{content:"“";color:var(--lime);font-size:1.25em}.phrase .quote::after{content:"”";color:var(--lime);font-size:1.25em}.phrase .author{margin-top:9px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.55}.phrase-tools{display:flex;justify-content:center;margin-top:12px}.phrase-next{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid rgba(195,255,128,.28);border-radius:99px;color:var(--lime);font-size:11px;font-weight:700;letter-spacing:.08em;background:rgba(195,255,128,.06)}.phrase-next svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.streak{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;opacity:.9}
.cnt{font-size:10px;letter-spacing:.1em;opacity:.5;margin:-8px 0 10px;text-transform:uppercase}
.row.gold{background:linear-gradient(150deg,rgba(255,214,122,.3),rgba(179,109,16,.22));border-color:rgba(255,205,110,.6)}
.tot.gold{position:relative;overflow:hidden;background:linear-gradient(160deg,#fff3c4 0%,#ffd874 28%,#e8a22c 55%,#c97e14 78%,#ffeca8 100%);color:#4a2d00;border-color:transparent;box-shadow:0 8px 22px rgba(201,126,20,.45),inset 0 1px 2px rgba(255,255,255,.6)}
.tot.gold::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-100%);animation:shine 3s infinite}
.fabs{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:6}
.fab{width:54px;height:54px;border-radius:50%;background:var(--navy);color:#fff;font-size:22px;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15)}
.rwlist{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.rwcard{border:1px solid rgba(0,0,0,.12);border-radius:18px;padding:12px 14px;text-align:left}
.rwcard b{display:block;font-size:14px}
.rwcard p{margin:4px 0 8px;font-size:13px;opacity:.75}
.rwcard .rwrow{display:flex;gap:8px;align-items:center;justify-content:space-between}
.rwcard .ic{display:flex;gap:10px}
.rwcard .ic button{font-size:16px}
.rwcard button.claim{background:var(--navy);color:#fff;padding:8px 14px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.06em}
@media (min-width:860px){
 main{max-width:1100px;padding:58px 32px 140px}
 #app{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-content:start}
 #app>*:not(.row){grid-column:1/-1}
 .it,.two,.bar,.top{max-width:900px;margin-left:auto;margin-right:auto}
}

/* --- Vista de tarea + layout responsive --- */
.taskgrid{display:grid;grid-template-columns:1fr;gap:10px}
.taskgrid .it{margin-bottom:0;width:100%;grid-template-columns:76px 1fr auto 50px;cursor:pointer}
.taskgrid .it .tm{pointer-events:none}
.taskpage{max-width:760px;margin:0 auto;padding:12px 0 40px}
.taskpage-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.taskpage-title{text-align:center;padding:0 12px}
.taskpage-title h1{margin:0;font-size:clamp(28px,7vw,48px);font-weight:300;letter-spacing:.08em;text-transform:uppercase}
.taskpage-title p{margin:8px 0 0;opacity:.72;font-size:14px}
.timerhero{padding:34px 22px;border:1px solid var(--line);border-radius:32px;background:rgba(255,255,255,.06);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.timerhero .when{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.62}
.timerhero .clock{font-size:clamp(72px,18vw,132px);font-weight:800;line-height:1;color:var(--lime);letter-spacing:-.05em;margin:18px 0 22px;font-variant-numeric:tabular-nums}
.timerhero .clock.finished{color:var(--coral)}
.timer-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:480px;margin:0 auto}
.timer-controls .b{margin:0;padding:16px 12px}
.timer-controls .wide{grid-column:1/-1}
.taskmeta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.taskmeta>div{padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:center}
.taskmeta span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-bottom:5px}
.taskmeta b{font-size:18px}
.taskactions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.taskactions .b{margin:0}
@media (min-width:700px){.taskgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1050px){.taskgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:860px){main{max-width:1280px;padding-top:58px}.dayview>.bar,.dayview>.two{max-width:none}.taskgrid .it{grid-template-columns:70px 1fr auto 48px;padding:14px 12px}.taskgrid .tt h2{font-size:17px}.taskgrid .pt{font-size:11px}}
@media (max-width:699px){main{padding-top:56px}.taskgrid .it{grid-template-columns:76px 1fr auto 50px}.taskmeta,.taskactions{grid-template-columns:1fr}.timerhero{padding:28px 14px}}


/* --- Editor compacto por pasos --- */
.taskedit-sheet{overflow:hidden;display:flex;flex-direction:column;max-height:min(92vh,680px);padding:28px 24px 22px}
.edit-slider{overflow:hidden;margin-top:6px}
.edit-track{display:flex;width:200%;transition:transform .32s cubic-bezier(.22,1,.36,1)}
.edit-step{width:50%;flex:none;padding:2px 2px 6px}
.edit-step label{margin:14px 0 8px}
.edit-step .wheels{height:176px}
.edit-dots{display:flex;justify-content:center;gap:9px;margin:14px 0 4px}
.edit-dot{width:9px;height:9px;border-radius:50%;background:rgba(36,58,114,.25);padding:0;transition:transform .2s,background .2s}
.edit-dot.on{background:var(--navy);transform:scale(1.25)}
.edit-footer{margin-top:10px}
.edit-footer .b{margin-top:10px}
.edit-delete{display:block;margin:9px auto 0;padding:7px 12px;font-size:11px;text-decoration:underline;opacity:.55}
@media(max-width:600px){.taskedit-sheet{width:calc(100% - 24px);padding:24px 18px 18px;border-radius:28px;max-height:94vh}.edit-step label{font-size:17px;margin:11px 0 7px}.edit-step input{padding:13px 16px}.edit-step .wheels{height:154px}.edit-step .wc{height:154px;padding:55px 0}.edit-step .wheels::before{top:55px}.edit-footer .b{padding:16px}.phrase{padding-left:16px;padding-right:16px}}

/* --- Ajustes responsive v4: cabecera + editor adaptable --- */
:root{--clock-h:46px}
main{padding-top:var(--clock-h)}
.clk{height:var(--clock-h);padding:0 18px;background:linear-gradient(90deg,rgba(6,18,56,.99),rgba(17,39,91,.98),rgba(6,18,56,.99));border-bottom:1px solid rgba(195,255,128,.28);box-shadow:0 5px 18px rgba(0,0,0,.22);font-size:12px}
.clk .ct{font-size:14px;letter-spacing:.08em;text-shadow:0 0 14px rgba(195,255,128,.3)}
.clk .cn{opacity:1;display:flex;align-items:center;gap:8px;font-weight:600;color:#dfe6f7}
.clk .cn::before{content:"AHORA";flex:none;padding:5px 8px;border-radius:99px;background:var(--lime);color:#0a1a45;font-size:9px;font-weight:800;letter-spacing:.12em}
.hd{top:var(--clock-h);width:100vw;margin:0 0 18px;margin-left:calc(50% - 50vw);padding-left:max(24px,calc((100vw - 1216px)/2));padding-right:max(24px,calc((100vw - 1216px)/2));border-top:0}
@media(min-width:860px){main{padding-top:var(--clock-h)}.hd{margin-bottom:18px}}
@media(max-width:699px){main{padding-top:var(--clock-h)}.clk{padding:0 12px}.clk .ct{font-size:12px}.clk .cn{font-size:11px;max-width:58%}.clk .cn::before{padding:4px 6px;font-size:8px}.hd{padding-left:20px;padding-right:20px}}

/* Editor: cada slide dicta su propia altura */
.taskedit-sheet{height:auto!important;max-height:calc(100dvh - 24px);overflow:auto;padding:26px 24px 20px}
.edit-slider{position:relative;overflow:hidden;margin-top:0;transition:height .28s cubic-bezier(.22,1,.36,1)}
.edit-track{align-items:flex-start}
.edit-step{padding:0 4px 4px}
.edit-step:first-child{min-height:230px;display:flex;flex-direction:column;justify-content:center}
.edit-step:first-child label:first-child{margin-top:0}
.edit-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 2px}
.edit-arrows{display:none;align-items:center;justify-content:space-between;width:100%;gap:14px}
.edit-arrow{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(36,58,114,.12);color:var(--navy);font-size:30px;line-height:1;border:1px solid rgba(36,58,114,.18)}
.edit-arrow:disabled{opacity:.22}
.edit-dots{margin:0}
@media(min-width:701px){.edit-dots{display:none}.edit-arrows{display:flex}.edit-nav{margin:12px 0 0}.taskedit-sheet{max-width:520px}.edit-step:first-child{min-height:245px}}
@media(max-width:700px){.edit-arrows{display:none}.edit-dots{display:flex}.taskedit-sheet{width:calc(100% - 24px);padding:22px 18px 16px}.edit-step:first-child{min-height:220px}.edit-footer{margin-top:6px}.edit-footer .b{margin-top:8px;padding:15px}.edit-delete{margin-top:7px}}



/* --- Sistema de apariencias v5 --- */
:root{--bg1:#12275c;--bg2:#0a1a45;--bg3:#061238;--glow:#2d4fa3;--surface:rgba(255,255,255,.06);--surface2:rgba(48,72,125,.60);--text:#fff;--muted:#b9c4e0;--accent:#c3ff80;--accentText:#0a1a45;--danger:#ff6b6b}
body{color:var(--text);background:radial-gradient(120% 55% at 50% -8%,var(--glow) 0%,transparent 62%),linear-gradient(180deg,var(--bg1),var(--bg2) 50%,var(--bg3)) fixed;transition:background 1.2s ease,color .5s ease}
.row,.it,.pill,.cb,.task-timer-card{background:var(--surface)}
.hd{background:var(--surface2)}
.nm,.tt h2,.top h1,.task-head h1{color:var(--text)}
.cnt,.tt p,.task-sub,.author{color:var(--muted)}
.clk{background:linear-gradient(90deg,var(--bg3),var(--bg2),var(--bg3))}
.fab.skin-fab{font-size:20px}
.skin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0 6px}
.skin-card{position:relative;text-align:left;border-radius:18px;padding:12px;background:#fff;color:#111;border:3px solid transparent;min-height:86px;overflow:hidden}
.skin-card.on{border-color:var(--navy);box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.skin-swatch{height:30px;border-radius:10px;margin-bottom:9px;border:1px solid rgba(0,0,0,.08)}
.skin-card b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.skin-card small{display:block;margin-top:3px;opacity:.62;font-size:10px}
@media(max-width:520px){.skin-grid{grid-template-columns:1fr 1fr;gap:8px}.skin-card{padding:9px;min-height:78px}}


/* Contraste explícito y skins cinematográficas */
.top .cb svg,.top .cb svg path{stroke:var(--navIcon,#dfe6f7)!important}
.clk .ct{color:var(--clockText,var(--lime))!important;text-shadow:none}
body[data-skin="natural"] .top .cb{border-color:color-mix(in srgb,var(--navIcon) 42%,transparent);background:color-mix(in srgb,var(--surface) 84%,transparent)}
body[data-skin="galaxia"]{background-image:radial-gradient(circle at 18% 24%,rgba(85,217,255,.13) 0 1px,transparent 2px),radial-gradient(circle at 76% 16%,rgba(255,255,255,.17) 0 1px,transparent 2px),radial-gradient(120% 55% at 50% -8%,var(--glow) 0%,transparent 62%),linear-gradient(180deg,var(--bg1),var(--bg2) 50%,var(--bg3));background-size:97px 97px,151px 151px,auto,auto}
body[data-skin="galaxia"] .row,body[data-skin="galaxia"] .it,body[data-skin="galaxia"] .timerhero{box-shadow:inset 0 0 0 1px rgba(85,217,255,.16),0 0 18px rgba(40,170,255,.05)}
body[data-skin="galaxia"] .fab,body[data-skin="galaxia"] .cb{box-shadow:0 0 16px rgba(85,217,255,.22);border-color:rgba(85,217,255,.38)}
body[data-skin="leyenda"] .row,body[data-skin="leyenda"] .it,body[data-skin="leyenda"] .timerhero{border-color:rgba(216,183,92,.26);box-shadow:inset 0 1px rgba(255,241,195,.05)}
body[data-skin="leyenda"] .hd{border-bottom-color:rgba(216,183,92,.34)}
body[data-skin="leyenda"] .fab,body[data-skin="leyenda"] .cb{border-color:rgba(216,183,92,.38)}

/* Mejoras seguras: actividad, estadísticas y ambiente */
.it.active-task{border-color:var(--lime);box-shadow:0 0 0 1px color-mix(in srgb,var(--lime) 55%,transparent),0 0 24px color-mix(in srgb,var(--lime) 20%,transparent);animation:activePulse 2.4s ease-in-out infinite}
.it.active-task::after{content:"EN CURSO";position:absolute;right:14px;top:-9px;padding:4px 8px;border-radius:99px;background:var(--lime);color:var(--navy);font-size:8px;font-weight:900;letter-spacing:.12em}
.timerhero.active-task{border-color:var(--lime);box-shadow:0 0 32px color-mix(in srgb,var(--lime) 18%,transparent)}
@keyframes activePulse{50%{transform:translateY(-2px);box-shadow:0 0 0 1px color-mix(in srgb,var(--lime) 70%,transparent),0 0 34px color-mix(in srgb,var(--lime) 27%,transparent)}}
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}.ambient::before,.ambient::after{content:"";position:absolute;width:42vw;height:42vw;border-radius:50%;filter:blur(70px);opacity:.12;will-change:transform;background:var(--lime)}.ambient::before{left:-15vw;top:12vh;transform:translate(calc(var(--mx,0)*18px),calc(var(--my,0)*18px))}.ambient::after{right:-17vw;bottom:-8vh;background:var(--coral);transform:translate(calc(var(--mx,0)*-14px),calc(var(--my,0)*-14px))}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.statbox{padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--surface);text-align:center}.statbox b{display:block;font-size:28px;color:#6fa72b;text-shadow:none}.statbox span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#536047;opacity:1}.history{display:grid;gap:8px;max-height:280px;overflow:auto;margin:12px 0}.hist{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px}.hist small{color:#536047;opacity:1}.hist .hp{color:#6fa72b;font-weight:800}.hist .hn{color:var(--coral);font-weight:800}
@media(prefers-reduced-motion:reduce){.it.active-task{animation:none}.ambient{display:none}}

 let ty=x.importance==="main"?"main":"routine",any=!x.time,step=0;const tm=x.time||"08:00",h0=+tm.slice(0,2),m0=+tm.slice(3,5);
 const colLoop=a=>`<div class="wc">${a.concat(a,a).map(v=>`<div>${v}</div>`).join("")}</div>`;
 const H=Array.from({length:12},(_,i)=>String(i+1).padStart(2,"0")),M=Array.from({length:60},(_,i)=>String(i).padStart(2,"0"));
 const occupied=d.items.filter(v=>v.time&&v.id!==id).reduce((m,v)=>{m[v.time]=v.t;return m},{});
 const inp=(iid,val)=>`<div class="inwrap"><input id="${iid}" value="${esc(val)}" autocomplete="off"><button class="clr" data-clr="${iid}" aria-label="Borrar" tabindex="-1">✕</button></div>`;
 const o=modal(`<div class="edit-slider"><div class="edit-track" id="etrack"><section class="edit-step"><label for="tt">Título</label>${inp("tt",x.t)}<label for="ss">Subtítulo</label>${inp("ss",x.s)}</section><section class="edit-step"><label>${view>=5?"Día neutral":"Importancia"}</label>${view>=5?`<p style="text-align:center;opacity:.62;margin:8px 0 16px">Sábado y domingo no modifican el puntaje.</p><div class="seg seg2" id="sg" style="display:none"><button data-v="routine">Rutina</button><button data-v="main">Principal</button></div>`:`<div class="seg seg2" id="sg"><button data-v="routine">Rutina</button><button data-v="main">Principal</button></div>`}<label>Horario</label><button class="any" id="an"></button><div class="wheels" id="wh">${colLoop(H)+colLoop(M)+`<div class="wc">${["AM","PM"].map(v=>`<div>${v}</div>`).join("")}</div>`}</div><p id="clash" style="color:#a33;font-size:12px;text-align:center;min-height:16px;margin:6px 0 0"></p></section></div></div><div class="edit-nav"><div class="edit-arrows"><button class="edit-arrow" id="prevStep" aria-label="Anterior">‹</button><span style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);font-weight:700" id="stepLabel">Datos principales</span><button class="edit-arrow" id="nextStep" aria-label="Siguiente">›</button></div><div class="edit-dots"><button class="edit-dot on" data-step="0" aria-label="Datos principales"></button><button class="edit-dot" data-step="1" aria-label="Importancia y horario"></button></div></div><div class="edit-footer"><button class="b p" id="ok">${id?"Actualizar tarea":"Agregar tarea"}</button><button class="b w" id="cn">Cancelar</button>${id?'<button class="edit-delete" id="dl">Quitar tarea</button>':''}</div>`);
 const sheet=o.querySelector('.sheet');sheet.classList.add('taskedit-sheet');
 const track=o.querySelector('#etrack'),slider=o.querySelector('.edit-slider'),steps=[...o.querySelectorAll('.edit-step')],dots=[...o.querySelectorAll('[data-step]')],prevStep=o.querySelector('#prevStep'),nextStep=o.querySelector('#nextStep'),stepLabel=o.querySelector('#stepLabel');
 const fitStep=()=>{slider.style.height=steps[step].scrollHeight+'px'};
 const goStep=n=>{step=Math.max(0,Math.min(1,n));track.style.transform=`translateX(-${step*50}%)`;dots.forEach((b,i)=>b.classList.toggle('on',i===step));if(prevStep)prevStep.disabled=step===0;if(nextStep)nextStep.disabled=step===1;if(stepLabel)stepLabel.textContent=step===0?'Datos principales':'Importancia y horario';requestAnimationFrame(fitStep)};
 dots.forEach(b=>b.onclick=()=>goStep(+b.dataset.step));if(prevStep)prevStep.onclick=()=>goStep(step-1);if(nextStep)nextStep.onclick=()=>goStep(step+1);window.addEventListener('resize',fitStep,{once:true});
 let sx=0;track.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});track.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)goStep(dx<0?1:0)},{passive:true});
 const sg=o.querySelector("#sg"),an=o.querySelector("#an"),wh=o.querySelector("#wh"),cs=[...o.querySelectorAll(".wc")],clash=o.querySelector("#clash"),okBtn=o.querySelector("#ok");
 const setTy=v=>{ty=v;sg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===v))};
 const val=()=>{if(any)return"";const a=Math.round(cs[0].scrollTop/44)%12,b=Math.round(cs[1].scrollTop/44)%60,c=Math.round(cs[2].scrollTop/44);return String((a+1)%12+(c?12:0)).padStart(2,"0")+":"+String(b).padStart(2,"0")};
 const checkClash=()=>{if(any){clash.textContent="";okBtn.disabled=false;return}const t=val(),o2=occupied[t];clash.textContent=o2?"Ese horario ya lo usa: "+o2:"";okBtn.disabled=!!o2};
 const setAny=v=>{any=v;an.classList.toggle("on",v);an.textContent=v?"Cualquier momento: activado":"Usar cualquier momento";wh.classList.toggle("off",v);checkClash()};
 sg.querySelectorAll("button").forEach(b=>b.onclick=()=>setTy(b.dataset.v));setTy(ty);
 an.onclick=()=>setAny(!any);setAny(any);
 o.querySelectorAll("[data-clr]").forEach(b=>b.onclick=()=>{const i=o.querySelector("#"+b.dataset.clr);i.value="";i.focus()});
 [[(h0%12||12)-1,12],[m0,60],[h0>=12?1:0,2]].forEach(([v,len],k)=>{const c=cs[k],loop=k<2;const base=loop?len:0;c.scrollTop=(base+v)*44;mark(c);c.onscroll=()=>{mark(c);checkClash();if(!loop)return;const i=Math.round(c.scrollTop/44);if(i<len*.5)c.scrollTop+=len*44;else if(i>=len*2.5)c.scrollTop-=len*44};[...c.children].forEach((e,j)=>e.onclick=()=>{setAny(false);c.scrollTo({top:j*44,behavior:"smooth"})})});
 ["pointerdown","wheel","touchstart"].forEach(ev=>wh.addEventListener(ev,()=>{if(any)setAny(false)},{passive:true}));
 checkClash();goStep(0);
 o.querySelector("#ok").onclick=()=>{const title=o.querySelector("#tt").value.trim();if(!title){goStep(0);return o.querySelector("#tt").focus()}const v={importance:ty,time:val(),t:title,s:o.querySelector("#ss").value.trim()};if(id)Object.assign(x,v);else{newId=uid();d.items.push({id:newId,status:null,done:false,...v})}save();shut(o);render()};
 o.querySelector("#cn").onclick=()=>shut(o);
 if(id)o.querySelector("#dl").onclick=()=>{d.items=d.items.filter(v=>v.id!==id);if(taskView===id)taskView=null;save();shut(o);render()};
}
const ambient=document.createElement("div");ambient.className="ambient";document.body.prepend(ambient);if(!matchMedia("(prefers-reduced-motion: reduce)").matches){let raf=0;addEventListener("pointermove",e=>{if(raf)return;raf=requestAnimationFrame(()=>{document.documentElement.style.setProperty("--mx",((e.clientX/innerWidth)-.5).toFixed(3));document.documentElement.style.setProperty("--my",((e.clientY/innerHeight)-.5).toFixed(3));raf=0})},{passive:true})}
render();initClock();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,onSnapshot,setDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAJBa_HH0XO0B64Z70LV2zErECnDFFa5dw",authDomain:"agenda-puntos.firebaseapp.com",projectId:"agenda-puntos",storageBucket:"agenda-puntos.firebasestorage.app",messagingSenderId:"617913164159",appId:"1:617913164159:web:ba895e653c2ade05fc3a4a"});
const auth=getAuth(app),db=getFirestore(app),ref=doc(db,"agenda","estado");
let unsub=null,timer=null,ov=null;
const send=async s=>{try{setSync("Guardando...");await setDoc(ref,{data:s,updated:Date.now()});setSync("Sincronizado")}catch(e){setSync("Sin conexión, se reintentará")}};
const push=s=>{clearTimeout(timer);timer=setTimeout(()=>{timer=null;send(s)},450)};
const MSG={"auth/invalid-credential":"Correo o contraseña incorrectos","auth/invalid-email":"El correo no es válido","auth/too-many-requests":"Demasiados intentos, espera un momento","auth/network-request-failed":"Sin conexión a internet","auth/unauthorized-domain":"Este sitio no está autorizado en Firebase"};
function login(msg=""){
 if(ov)return;
 ov=document.createElement("div");ov.className="ov";
 ov.innerHTML=`<div class="sheet"><h2>Iniciar sesión</h2><label for="em">Correo</label><input id="em" type="email" autocomplete="username" inputmode="email"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password"><p id="er" role="alert" style="text-align:center;color:#8a1c1c;font-size:14px;min-height:20px;margin:12px 0 0">${msg}</p><button class="b p" id="go" style="margin-top:12px">Entrar</button></div>`;
 document.body.appendChild(ov);
 const em=ov.querySelector("#em"),pw=ov.querySelector("#pw"),er=ov.querySelector("#er"),go=ov.querySelector("#go");
 const enter=async()=>{er.textContent="";go.disabled=true;go.textContent="Entrando...";try{await signInWithEmailAndPassword(auth,em.value.trim(),pw.value)}catch(e){er.textContent=MSG[e.code]||"No se pudo iniciar sesión";go.disabled=false;go.textContent="Entrar"}};
 go.onclick=enter;pw.onkeydown=e=>{if(e.key==="Enter")enter()};
}
window.fbOut=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
 unsub?.();unsub=null;clearTimeout(timer);timer=null;window.cloudPush=null;
 if(!u){window.fbUser=null;login();render();return}
 window.fbUser=u.email;if(ov){ov.remove();ov=null}
 setSync("Conectando...");
 unsub=onSnapshot(ref,snap=>{
  if(snap.metadata.hasPendingWrites||timer)return;
  if(!snap.exists()){send(getState());return}
  const s=snap.data().data;
  if(typeof s==="string"&&s!==getState())applyRemote(s);
  setSync("Sincronizado");
 },err=>{
  if(err.code==="permission-denied")signOut(auth).then(()=>login("Tu correo no tiene permiso para esta agenda"));
  else setSync("Sin conexión");
 });
 window.cloudPush=push;render();
});
</script>
