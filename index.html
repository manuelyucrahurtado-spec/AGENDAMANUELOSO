<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de Puntos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap">
<style>
:root{color-scheme:dark;--lime:#c3ff80;--navy:#243a72;--coral:#ff6b6b;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(120% 55% at 50% -8%,#2d4fa3 0%,transparent 62%),linear-gradient(180deg,#12275c,#0a1a45 50%,#061238) fixed}
main{max-width:520px;margin:0 auto;padding:44px 20px 270px}
.clk{position:fixed;top:0;left:0;right:0;z-index:8;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 18px;padding-top:calc(9px + env(safe-area-inset-top,0px));background:rgba(6,18,56,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px;letter-spacing:.05em;border-bottom:1px solid var(--line)}
.clk .ct{font-weight:800;color:var(--lime)}
.clk .cn{opacity:.75;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button:disabled{opacity:.5;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:transform .15s}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.hd{position:sticky;top:44px;z-index:5;display:flex;justify-content:space-between;align-items:baseline;margin:0 -20px 18px;padding:18px 24px;background:rgba(48,72,125,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);letter-spacing:.16em;font-size:13px;font-weight:600}
.hd b{font-size:44px;letter-spacing:0;font-weight:800;color:var(--lime);line-height:1}
.row{display:flex;align-items:center;gap:16px;width:100%;padding:16px 18px;margin-bottom:12px;border-radius:24px;background:var(--card);border:1px solid var(--line);text-align:left}
.row .l{flex:1;min-width:0}
.nm{font-weight:300;font-size:clamp(20px,6vw,26px);letter-spacing:.16em;text-transform:uppercase;margin-bottom:12px}
.bar{height:14px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;position:relative;overflow:hidden;border-radius:99px;background:linear-gradient(90deg,#a8ef5c,#e4ffb0);box-shadow:0 0 16px rgba(195,255,128,.5);transition:width .8s cubic-bezier(.22,1,.36,1)}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.2s infinite}
.tot{flex:none;width:84px;height:84px;border-radius:22px;display:grid;place-items:center;text-align:center;font-size:11px;letter-spacing:.14em;background:rgba(255,255,255,.08);border:1px solid var(--line);transition:background .4s,color .4s}
.tot b{display:block;font-size:32px;letter-spacing:0;font-weight:800;line-height:1.1}
.tot.pos{background:linear-gradient(150deg,#d4ff9a,#a8ef5c);color:#0a1a45;border-color:transparent;box-shadow:0 8px 22px rgba(168,239,92,.28)}
.tot.neg{background:linear-gradient(150deg,#ff9a9a,#ff6b6b);color:#3a0f0f;border-color:transparent}
.link{display:block;margin:16px auto 0;padding:8px 14px;text-decoration:underline;font-size:13px;opacity:.65}
.rw{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,#061238 30px)}
.rw>div{max-width:492px;margin:0 auto;padding:16px 14px 16px;border:1px solid rgba(195,255,128,.5);border-radius:28px;background:rgba(6,18,56,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-align:center;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.rw h3{margin:0 0 12px;color:var(--lime);font-size:clamp(24px,7vw,32px);letter-spacing:.04em;font-weight:800}
.tiles{display:flex;gap:10px;align-items:stretch}
.tile{flex:1;border-radius:20px;background:rgba(195,255,128,.22);color:#dfe8c9;padding:14px 4px;font-size:12px;font-style:italic;display:grid;place-content:center;gap:2px;border:1px solid rgba(195,255,128,.18)}
.tile b{font-size:clamp(26px,8vw,38px);font-style:normal;font-weight:800}
.tile.on{flex:1.35;color:#0a1a45;background:linear-gradient(150deg,#d4ff9a,#a8ef5c);animation:glow 2s ease-in-out infinite}
.tile.on span{background:var(--navy);color:#fff;font-style:normal;font-weight:800;font-size:11px;letter-spacing:.06em;border-radius:9px;padding:8px 6px;margin-bottom:4px}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px}
.top h1{margin:0;font-weight:300;font-size:clamp(32px,10vw,44px);letter-spacing:.1em}
.cb{width:50px;height:50px;border:1.5px solid rgba(255,255,255,.22);border-radius:50%;display:grid;place-items:center;background:var(--card)}
.cb svg{width:24px;height:24px;stroke:#dfe6f7;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 16px}
.pill{display:flex;justify-content:space-between;align-items:baseline;padding:12px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:13px;font-style:italic}
.pill b{font-size:32px;font-style:normal;font-weight:800;line-height:1.1}
.pill.g{background:linear-gradient(150deg,#d4ff9a,#a8ef5c);color:#0a1a45;border-color:transparent}
.it{display:grid;grid-template-columns:34px 76px 1fr auto 50px;gap:8px;align-items:center;padding:12px 12px;margin-bottom:10px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:background .4s,border-color .4s}
.pen{padding:5px;display:grid}.pen svg{width:22px;height:22px;stroke:#b9c4e0;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tm{font-weight:800;font-size:14px;line-height:1.15}
.tt{text-align:center;min-width:0}
.tt h2{margin:0;font-weight:300;font-size:clamp(16px,4.8vw,20px);letter-spacing:.1em;overflow-wrap:anywhere}
.tt p{margin:3px 0 0;font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pt{font-size:12px;font-style:italic;color:var(--lime);text-align:right}.neg .pt{color:var(--coral)}.neu .pt{color:#b9c4e0}
.ck{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.1);display:grid;place-items:center;transition:background .3s,transform .12s}
.ck svg{width:26px;height:26px;stroke:rgba(255,255,255,.35);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.done{border-color:rgba(195,255,128,.35);background:rgba(195,255,128,.07)}
.done.neg{border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.08)}
.done.neu{border-color:rgba(219,230,255,.35);background:rgba(219,230,255,.07)}
.done .ck{background:var(--lime)}.done.neg .ck{background:var(--coral)}.done.neu .ck{background:#dbe6ff}
.done .ck svg{stroke:var(--navy)}
.pop{--rc:195,255,128;animation:pop .5s cubic-bezier(.34,1.56,.64,1),ring .65s ease-out}
.neg .pop{--rc:255,107,107}
.pop svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .35s .12s ease-out forwards}
.in{animation:up .5s backwards;animation-delay:calc(var(--i,0)*55ms)}
.flash{animation:flash .9s ease-out}
.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:rgba(12,26,72,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s}
.sheet{position:relative;width:100%;max-width:420px;max-height:92vh;overflow:auto;border-radius:34px;background:linear-gradient(160deg,#d8ffa4,#b4f468);color:#000;padding:30px 24px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:sheet .45s cubic-bezier(.34,1.3,.64,1)}
.xclose{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.12);font-size:15px;display:grid;place-items:center;z-index:1}
.ov.out{animation:fadeout .22s forwards}.ov.out .sheet{animation:sheetout .22s forwards}
.sheet h2{margin:0;text-align:center;font-size:clamp(28px,8vw,36px);font-weight:800;color:var(--navy)}
.big{text-align:center;font-size:clamp(76px,26vw,116px);font-weight:800;color:var(--navy);line-height:1.05;margin:6px 0 20px;animation:bump .6s cubic-bezier(.34,1.56,.64,1)}
.sheet h4{text-align:center;font-size:21px;margin:0 0 12px;font-weight:800}
.op{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:9px 6px;font-size:17px;letter-spacing:.08em;animation:up .4s backwards;animation-delay:calc(var(--i)*70ms + .3s)}
.op i{flex:none;width:28px;height:28px;border:3px solid #000;border-radius:9px;transition:background .2s}
.op:active i{background:rgba(36,58,114,.35)}
.op.x{text-decoration:line-through}.op.x i{background:var(--navy)}
.op:disabled{opacity:.55;cursor:default}
label{display:block;text-align:center;font-size:20px;letter-spacing:.14em;text-transform:uppercase;margin:16px 0 8px;font-weight:300}
label:first-child{margin-top:0}
input{width:100%;border:0;border-radius:14px;background:#fff;padding:15px 18px;font:italic 16px inherit;color:#444}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.seg2{grid-template-columns:repeat(2,1fr)}
.seg button{background:#fff;border-radius:14px;padding:12px 4px;font-size:12.5px;font-weight:600;transition:background .25s,color .25s,transform .15s}
.seg button.on{background:var(--navy);color:#fff}
.inwrap{position:relative}
.inwrap input{padding-right:40px}
.clr{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#9aa5c2;font-size:14px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.clr:active{background:rgba(0,0,0,.08)}
.any{display:block;margin:0 auto 10px;padding:9px 16px;border-radius:99px;background:#fff;font-size:13px;font-weight:600;transition:background .25s,color .25s}
.any.on{background:var(--navy);color:#fff}
.wheels{position:relative;display:flex;gap:4px;height:176px;background:#fff;border-radius:18px;overflow:hidden;transition:opacity .25s}
.wheels.off{opacity:.45}
.wheels::before{content:"";position:absolute;left:8px;right:8px;top:66px;height:44px;border-radius:12px;background:rgba(36,58,114,.12);pointer-events:none}
.wheels::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#fff 0,rgba(255,255,255,0) 36%,rgba(255,255,255,0) 64%,#fff 100%)}
.wc{flex:1;height:176px;overflow-y:scroll;scroll-snap-type:y mandatory;padding:66px 0;scrollbar-width:none}
.wc::-webkit-scrollbar{display:none}
.wc div{height:44px;line-height:44px;text-align:center;font-size:22px;font-weight:600;color:#9aa5c2;scroll-snap-align:center;transition:color .15s,transform .15s;cursor:pointer}
.wc div.s{color:var(--navy);transform:scale(1.18)}
.sy{text-align:center;font-size:12px;opacity:.6;margin-top:10px}
.b{display:block;width:100%;border-radius:99px;padding:19px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:14px;margin-top:12px}
.b.p{background:#465b8a;color:#fff;margin-top:24px;box-shadow:0 8px 20px rgba(36,58,114,.35)}.b.w{background:#fff;color:#000}
.toast{position:fixed;left:50%;bottom:250px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:99px;font-size:14px;z-index:20;animation:toast 2.2s forwards}
.fl{position:fixed;font-weight:800;font-size:22px;color:var(--lime);pointer-events:none;z-index:15;text-shadow:0 2px 10px rgba(0,0,0,.45);animation:floatup .9s ease-out forwards}
.fl.n{color:var(--coral)}
.cf{position:absolute;left:50%;top:38%;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:burst 1.2s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(var(--rc),.75)}100%{box-shadow:0 0 0 18px rgba(var(--rc),0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes fade{from{opacity:0}}@keyframes fadeout{to{opacity:0}}
@keyframes sheet{from{opacity:0;transform:translateY(40px) scale(.92)}}
@keyframes sheetout{to{opacity:0;transform:translateY(30px) scale(.95)}}
@keyframes bump{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(195,255,128,.5)}50%{box-shadow:0 0 22px 4px rgba(195,255,128,.55)}}
@keyframes flash{0%{background:rgba(195,255,128,.35)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,14px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-58px)}}
@keyframes burst{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),calc(var(--y) + 150px)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.pop svg path{stroke-dasharray:none;stroke-dashoffset:0}}
.phrase{grid-column:1/-1;text-align:center;margin:4px auto 28px;padding:14px 24px 4px;max-width:820px}.phrase .eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--lime);font-weight:800;opacity:.9;margin-bottom:10px}.phrase .quote{font-size:clamp(18px,2.4vw,28px);line-height:1.35;font-weight:300;letter-spacing:.015em}.phrase .quote::before{content:"“";color:var(--lime);font-size:1.25em}.phrase .quote::after{content:"”";color:var(--lime);font-size:1.25em}.phrase .author{margin-top:9px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.55}
.streak{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;opacity:.9}
.cnt{font-size:10px;letter-spacing:.1em;opacity:.5;margin:-8px 0 10px;text-transform:uppercase}
.row.gold{background:linear-gradient(150deg,rgba(255,214,122,.3),rgba(179,109,16,.22));border-color:rgba(255,205,110,.6)}
.tot.gold{position:relative;overflow:hidden;background:linear-gradient(160deg,#fff3c4 0%,#ffd874 28%,#e8a22c 55%,#c97e14 78%,#ffeca8 100%);color:#4a2d00;border-color:transparent;box-shadow:0 8px 22px rgba(201,126,20,.45),inset 0 1px 2px rgba(255,255,255,.6)}
.tot.gold::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-100%);animation:shine 3s infinite}
.fabs{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:6}
.fab{width:54px;height:54px;border-radius:50%;background:var(--navy);color:#fff;font-size:22px;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15)}
.rwlist{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.rwcard{border:1px solid rgba(0,0,0,.12);border-radius:18px;padding:12px 14px;text-align:left}
.rwcard b{display:block;font-size:14px}
.rwcard p{margin:4px 0 8px;font-size:13px;opacity:.75}
.rwcard .rwrow{display:flex;gap:8px;align-items:center;justify-content:space-between}
.rwcard .ic{display:flex;gap:10px}
.rwcard .ic button{font-size:16px}
.rwcard button.claim{background:var(--navy);color:#fff;padding:8px 14px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.06em}
@media (min-width:860px){
 main{max-width:1100px;padding:58px 32px 140px}
 #app{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-content:start}
 #app>*:not(.row){grid-column:1/-1}
 .it,.two,.bar,.top{max-width:900px;margin-left:auto;margin-right:auto}
}

/* --- Vista de tarea + layout responsive --- */
.taskgrid{display:grid;grid-template-columns:1fr;gap:10px}
.taskgrid .it{margin-bottom:0;width:100%;grid-template-columns:76px 1fr auto 50px;cursor:pointer}
.taskgrid .it .tm{pointer-events:none}
.taskpage{max-width:760px;margin:0 auto;padding:12px 0 40px}
.taskpage-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.taskpage-title{text-align:center;padding:0 12px}
.taskpage-title h1{margin:0;font-size:clamp(28px,7vw,48px);font-weight:300;letter-spacing:.08em;text-transform:uppercase}
.taskpage-title p{margin:8px 0 0;opacity:.72;font-size:14px}
.timerhero{padding:34px 22px;border:1px solid var(--line);border-radius:32px;background:rgba(255,255,255,.06);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.timerhero .when{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.62}
.timerhero .clock{font-size:clamp(72px,18vw,132px);font-weight:800;line-height:1;color:var(--lime);letter-spacing:-.05em;margin:18px 0 22px;font-variant-numeric:tabular-nums}
.timerhero .clock.finished{color:var(--coral)}
.timer-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:480px;margin:0 auto}
.timer-controls .b{margin:0;padding:16px 12px}
.timer-controls .wide{grid-column:1/-1}
.taskmeta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.taskmeta>div{padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:center}
.taskmeta span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-bottom:5px}
.taskmeta b{font-size:18px}
.taskactions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.taskactions .b{margin:0}
@media (min-width:700px){.taskgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1050px){.taskgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:860px){main{max-width:1280px;padding-top:58px}.dayview>.bar,.dayview>.two{max-width:none}.taskgrid .it{grid-template-columns:70px 1fr auto 48px;padding:14px 12px}.taskgrid .tt h2{font-size:17px}.taskgrid .pt{font-size:11px}}
@media (max-width:699px){main{padding-top:56px}.taskgrid .it{grid-template-columns:76px 1fr auto 50px}.taskmeta,.taskactions{grid-template-columns:1fr}.timerhero{padding:28px 14px}}

</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<main id="app"></main>
<script>
const KEY="agenda-puntos-v1",MAXP=50,MINP=40;
